        <script>
            // Lấy tên người dùng từ sessionStorage
            const username = sessionStorage.getItem('username');
            if (username) {
                document.getElementById('welcomeMessage').textContent = `Xin chào, ${username}!`;

        <script>
        function updateUserMenu() {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
            const userMenu = document.getElementById('userMenu');
            
            if (isLoggedIn) {
                userMenu.innerHTML = `
                    <li role="presentation"><a role="menuitem" tabindex="-1" href="06_myprofile.html">My Profile</a></li>
                    <li role="presentation"><a role="menuitem" tabindex="-3" href="#" onclick="logout()">Log Out</a></li>
                `;
            } else {
                userMenu.innerHTML = `
                    <li role="presentation"><a role="menuitem" tabindex="-4" href="05_login.html">Login account</a></li>
                `;
            }
        }

        function logout() {
            // Xóa thông tin đăng nhập khỏi sessionStorage
            sessionStorage.removeItem('username');
            sessionStorage.removeItem('userId');
            sessionStorage.removeItem('isLoggedIn');
            
            // Chuyển hướng về trang chủ
            window.location.href = 'index.html';
        }

        // Kiểm tra đăng nhập khi tải trang
        document.addEventListener('DOMContentLoaded', () => {
            updateUserMenu();
            
            // Kiểm tra và chuyển hướng cho các trang yêu cầu đăng nhập
            const restrictedPages = ['03_new_topic.html', '07_profile.html'];
            const currentPage = window.location.pathname.split('/').pop();
            
            if (restrictedPages.includes(currentPage) && sessionStorage.getItem('isLoggedIn') !== 'true') {
                alert('Vui lòng đăng nhập để truy cập trang này');
                window.location.href = '05_login.html';
            }
        });
        </script>
