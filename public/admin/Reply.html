<script>
  
  async function deleteReply(replyId) {
      if (confirm('Are you sure you want to delete this reply?')) {
          try {
              const response = await fetch(`http://localhost:5502/replies/${replyId}`, {
                  method: 'DELETE',
              });
              
              if (response.ok) {
                  alert('Reply deleted successfully!');
                  getReplies(); // Refresh the reply list
              } else {
                  alert('Failed to delete reply.');
              }
          } catch (error) {
              console.error('Error deleting reply:', error);
          }
      }
  }
  
  async function getReplies() {
    try {
        const response = await fetch('http://localhost:5502/replies'); // Endpoint API
        const replies = await response.json();

        const replyTableBody = document.getElementById('replyData');
        replyTableBody.innerHTML = ''; // Xóa dữ liệu hiện có

        replies.forEach(reply => {
            const row = document.createElement('tr'); // Tạo hàng mới
            row.style.textAlign = 'center'; // Canh giữa văn bản
            row.innerHTML = `
                <td>${reply.reply_id}</td>
                <td>${reply.post_id}</td>
                <td>${reply.user_id}</td>
                <td>${reply.reply_content}</td>
                <td>${new Date(reply.reply_date).toLocaleString()}</td>
                <td>${reply.reply_target_id || '-'}</td>
                <td>
                    <button onclick="editReply(${reply.reply_id})">Chỉnh sửa</button>
                    <button onclick="deleteReply(${reply.reply_id})">Xóa</button>
                </td>
            `;
            replyTableBody.appendChild(row); // Thêm hàng mới vào bảng
        });
    } catch (error) {
        console.error('Lỗi khi lấy dữ liệu phản hồi:', error);
    }
}

async function editReply(replyId) {
    try {
        const response = await fetch(`http://localhost:5502/replies/${replyId}`);

        if (!response.ok) {
            const errorMessage = await response.text();
            console.error('Lỗi khi lấy dữ liệu phản hồi:', errorMessage);
            alert('Có lỗi xảy ra khi lấy dữ liệu. Vui lòng kiểm tra console.');
            return;
        }

        const reply = await response.json();

        // Điền dữ liệu vào biểu mẫu chỉnh sửa, đảm bảo các ID là số
        document.getElementById('replyId').value = reply.reply_id;
        document.getElementById('replyPostId').value = reply.post_id;
        document.getElementById('replyUserId').value = reply.user_id;
        document.getElementById('replyContent').value = reply.reply_content;

        // Mở modal
        document.getElementById('editReplyModal').style.display = 'block';
    } catch (error) {
        console.error('Error fetching post data for edit:', error);
    }
}

document.getElementById('updateReplyForm').onsubmit = async function(event) {
    event.preventDefault(); // Ngăn chặn việc gửi biểu mẫu mặc định
    const replyId = Number(document.getElementById('replyId').value); // Chuyển đổi thành số
    const postId = Number(document.getElementById('replyPostId').value); // Chuyển đổi thành số
    const userId = Number(document.getElementById('replyUserId').value); // Chuyển đổi thành số

    const replyData = {
        post_id: postId,
        user_id: userId,
        reply_content: document.getElementById('replyContent').value,
        reply_date: new Date().toISOString() // Đặt ngày hiện tại
    };

    // Ghi lại dữ liệu phản hồi trước khi gửi
    console.log('Dữ liệu phản hồi sẽ được gửi:', replyData);

    try {
        const response = await fetch(`http://localhost:5502/replies/${replyId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(replyData)
        });

        if (response.ok) {
            alert('Phản hồi đã được cập nhật thành công!');
            closeModal(); // Hàm để đóng modal
            getReplies(); // Làm mới danh sách phản hồi
        } else {
          console.error('Error updating reply:', error); // Lấy thông báo lỗi từ phản hồi
            alert(`Cập nhật phản hồi không thành công: ${errorMessage}`);
        }
    } catch (error) {
        console.error('Lỗi khi cập nhật phản hồi:', error);
        alert('Đã xảy ra lỗi không mong muốn. Vui lòng kiểm tra console để biết chi tiết.');
    }
};


// Hàm để đóng modal
function closeModal() {
    document.getElementById('editReplyModal').style.display = 'none';
}

// Gọi hàm khi cửa sổ được tải
window.onload = getReplies;
  </script>
