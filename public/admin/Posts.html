<script>
  async function getPosts() {
      try {
          const response = await fetch('http://localhost:5502/posts'); // Địa chỉ API
          const posts = await response.json();
          
          const postTableBody = document.getElementById('postData');
          postTableBody.innerHTML = ''; // Xóa dữ liệu hiện có
          
          posts.forEach(post => {
              const row = document.createElement('tr'); // Tạo hàng mới
              row.style.textAlign = 'center'; // Canh giữa văn bản
              row.innerHTML = `
                  <td>${post.post_id}</td>
                  <td>${post.user_id}</td>
                  <td>${post.post_title}</td>
                  <td>${post.post_content}</td>
                  <td>${post.post_like}</td>
                  <td>${post.post_view}</td>
                  <td>${post.post_replies}</td>
                  <td>${new Date(post.post_date).toLocaleString()}</td> <!-- Định dạng ngày -->
                  <td>
                      <button onclick="deletePost(${post.post_id})">Xóa</button>
                      <button onclick="editPost(${post.post_id})">Sửa</button>
                  </td>
              `;
              postTableBody.appendChild(row); // Thêm hàng mới vào bảng
          });
      } catch (error) {
          console.error('Error fetching posts:', error);
      }
  }

  async function deletePost(postId) {
      if (confirm('Are you sure you want to delete this post?')) {
          try {
              const response = await fetch(`http://localhost:5502/posts/${postId}`, {
                  method: 'DELETE',
              });
              
              if (response.ok) {
                  alert('Post deleted successfully!');
                  getPosts(); // Làm mới danh sách bài viết
              } else {
                  alert('Failed to delete post.');
              }
          } catch (error) {
              console.error('Error deleting post:', error);
          }
      }
  }

  async function editPost(postId) {
    try {
        const response = await fetch(`http://localhost:5502/posts/${postId}`);
        const post = await response.json();

        // Điền dữ liệu vào các trường của biểu mẫu
        document.getElementById('postId').value = post.post_id;
        document.getElementById('userId').value = post.user_id;
        document.getElementById('title').value = post.post_title; // Dùng post_title
        document.getElementById('content').value = post.post_content; // Dùng post_content
        document.getElementById('likes').value = post.post_like || 0; // Dùng post_like
        document.getElementById('views').value = post.post_view || 0; // Dùng post_view
        document.getElementById('replies').value = post.post_replies || 0; // Dùng post_replies

        // Hiển thị modal
        document.getElementById('updatePostModal').style.display = 'block';
    } catch (error) {
        console.error('Error fetching post data for edit:', error);
    }
}

document.getElementById('updatePostForm').onsubmit = async function(event) {
    event.preventDefault(); // Ngăn chặn việc gửi biểu mẫu mặc định
    const postId = Number(document.getElementById('postId').value); // Chuyển đổi thành số

    const postData = {
        user_id: Number(document.getElementById('userId').value),
        post_title: document.getElementById('title').value, // Dùng post_title
        post_content: document.getElementById('content').value, // Dùng post_content
        post_like: Number(document.getElementById('likes').value) || 0, // Dùng post_like
        post_view: Number(document.getElementById('views').value) || 0, // Dùng post_view
        post_replies: Number(document.getElementById('replies').value) || 0 // Dùng post_replies
    };

    // Ghi lại dữ liệu bài viết trước khi gửi
    console.log('Post Data to be sent:', postData);

    try {
        const response = await fetch(`http://localhost:5502/posts/${postId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(postData)
        });

        if (response.ok) {
            alert('Post updated successfully!');
            closePostModal(); 
            getPosts(); // Làm mới danh sách bài viết
        } else {
            const errorMessage = await response.text(); // Lấy thông báo lỗi từ phản hồi
            alert(`Failed to update post: ${errorMessage}`);
        }
    } catch (error) {
        console.error('Error updating post:', error);
        alert('An unexpected error occurred. Check the console for details.');
    }
};
function closePostModal() {
    document.getElementById('updatePostModal').style.display = 'none'; // Đóng modal
}

  window.onload = getPosts; // Gọi hàm khi cửa sổ được tải
</script>
