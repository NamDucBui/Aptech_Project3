<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Admin CarBreezy</title>
</head>
<body>
    <div id="wrapper">
        <form action="" id="form-login" autocomplete="off" method="POST">
            <h1 class="form-heading">Login Admin</h1>
            <div class="form-group">
                <i class="far fa-user"></i>
                <input type="text" name="username" class="form-input" placeholder="Tên đăng nhập" required>
            </div>
            <div class="form-group">
                <i class="fas fa-key"></i>
                <input type="password" name="password" class="form-input" placeholder="Mật khẩu" required id="password">
                <div id="eye">
                    <i class="far fa-eye" id="toggle-password"></i>
                </div>
            </div>
            <input type="submit" name="dangnhap" value="Đăng nhập" class="form-submit">
        </form>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="login.js"></script>
</html>
