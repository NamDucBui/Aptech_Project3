        <script>
            document.addEventListener('DOMContentLoaded', () => {
                let isEditing = false; // Track editing state

                // Load user profile when the page loads
                loadUserProfile();

                async function loadUserProfile() {
                    const userId = sessionStorage.getItem('userId'); // Retrieve userId from sessionStorage

                    if (!userId) {
                        console.error('Error: No userId found in sessionStorage. Please log in to access your profile.');
                        return;
                    }

                    try {
                        const response = await fetch(`http://localhost:5502/users/${userId}`);
                        if (!response.ok) {
                            throw new Error(`Failed to fetch user data: ${response.status} ${response.statusText}`);
                        }

                        const userData = await response.json();
                        console.log('User Data:', userData);
                        updateProfileUI(userData);
                    } catch (error) {
                        console.error('Error fetching user data:', error.message);
                    }
                }

                function updateProfileUI(user) {
                    try {
                        // Set values in input fields
                        document.getElementById('editUsername').value = user.username || '';
                        document.getElementById('editEmail').value = user.email || '';
                        document.getElementById('editContactDetails').value = user.contact_details || '';
                        document.getElementById('editPersonalInfo').value = user.personal_info || '';
                        document.getElementById('editProfessionalInfo').value = user.professional_info || '';
                        document.getElementById('editQualifications').value = user.qualifications || '';
                        document.getElementById('editExperience').value = user.experience || '';
                        document.getElementById('editAchievements').value = user.achievements || '';
                        document.getElementById('editProfileVisibility').value = user.profile_visibility || '';
                    } catch (error) {
                        console.error('Error updating profile UI:', error.message);
                    }
                }

                // Ensure these buttons exist before adding event listeners
                const editProfileBtn = document.getElementById('editProfileBtn');
                const saveProfileBtn = document.getElementById('saveProfileBtn');

                if (editProfileBtn && saveProfileBtn) {
                    editProfileBtn.addEventListener('click', () => {
                        isEditing = !isEditing; // Toggle editing state
                        toggleEditMode(isEditing);
                    });

                    saveProfileBtn.addEventListener('click', async () => {
                        const userId = sessionStorage.getItem('userId');
                        const updatedUserData = {
                            username: document.getElementById('editUsername').value,
                            email: document.getElementById('editEmail').value,
                            contact_details: document.getElementById('editContactDetails').value,
                            personal_info: document.getElementById('editPersonalInfo').value,
                            professional_info: document.getElementById('editProfessionalInfo').value,
                            qualifications: document.getElementById('editQualifications').value,
                            experience: document.getElementById('editExperience').value,
                            achievements: document.getElementById('editAchievements').value,
                            profile_visibility: document.getElementById('editProfileVisibility').value
                        };

                        // Log the updated user data before sending
                        console.log('Updated User Data:', updatedUserData);

                        try {
                            const response = await fetch(`http://localhost:5502/users/${userId}`, {
                                method: 'PUT', // Use PUT to update user data
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(updatedUserData)
                            });

                            if (!response.ok) {
                                throw new Error(`Failed to update user data: ${response.status} ${response.statusText}`);
                            }

                            alert('Profile updated successfully!');
                            loadUserProfile(); // Reload the user data
                            toggleEditMode(false); // Exit edit mode
                        } catch (error) {
                            console.error('Error updating user data:', error.message);
                        }
                    });
                } else {
                    console.error('Error: Edit Profile Button or Save Profile Button not found. Please ensure the buttons are present in the HTML.');
                }

                function toggleEditMode(editing) {
                    const inputs = document.querySelectorAll('#profileForm input');
                    inputs.forEach(input => {
                        input.disabled = !editing; // Enable/disable inputs based on editing state
                    });
                    saveProfileBtn.style.display = editing ? 'block' : 'none'; // Show save button only in edit mode
                }
            });
            
        </script>
